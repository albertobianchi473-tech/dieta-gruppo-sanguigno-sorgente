name: diete_gruppo_sanguigno
description: "App per la dieta del gruppo sanguigno"
publish_to: 'none'

version: 1.0.10+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  excel: ^4.0.6
  path_provider: ^2.1.3
  http: ^1.2.1
  fl_chart: ^0.69.0
  url_launcher: ^6.2.6
  google_mobile_ads: ^5.1.0
  share_plus: ^10.1.2  # 👈 AGGIUNGI QUESTA RIGA

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  

flutter:
  uses-material-design: true
  assets:
    - assets/diete_gruppo_sanguigno.xlsx
    - assets/images/
    - assets/Ketsuekigataods.xlsx

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icona_app.png"
  min_sdk_android: 21